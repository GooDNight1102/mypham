<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanh toán | GLOWÉ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js"></script>
  <script>document.documentElement.dataset.theme = localStorage.getItem('glowe_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container">
    <h1>Thanh toán</h1>
    <form id="checkout" class="layout-2" novalidate>
      <div class="card">
        <h3>Thông tin giao hàng</h3>
        <div class="row">
          <label>Họ tên người nhận <input name="receiverName" required maxlength="100" autocomplete="name"></label>
          <label>Số điện thoại <input name="phone" required pattern="0\d{9}" inputmode="numeric" maxlength="10" autocomplete="tel"></label>
        </div>
        <label>Địa chỉ nhận hàng <input name="address" required maxlength="255" autocomplete="street-address" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành"></label>
        <label>Ghi chú <textarea name="note" rows="2" maxlength="255" placeholder="Giao giờ hành chính, gọi trước khi giao..."></textarea></label>

        <h3 style="margin-top:8px">Phương thức thanh toán</h3>
        <div class="methods">
          <label class="method"><input type="radio" name="paymentMethod" value="cod" checked>
            <span><strong>💵 Thanh toán khi nhận hàng (COD)</strong><span class="small muted">Trả tiền mặt cho shipper</span></span></label>
          <label class="method"><input type="radio" name="paymentMethod" value="card">
            <span><strong>💳 Thẻ ngân hàng (giả lập)</strong><span class="small muted">Visa / Mastercard / ATM — nhập thẻ ở bước tiếp theo</span></span></label>
          <label class="method"><input type="radio" name="paymentMethod" value="ewallet">
            <span><strong>📱 Ví điện tử (giả lập)</strong><span class="small muted">Quét mã QR ở bước tiếp theo</span></span></label>
        </div>
      </div>

      <aside class="card summary">
        <h3>Đơn hàng của bạn</h3>
        <div id="lines"></div>
        <div id="sum"></div>
        <p class="error" id="err"></p>
        <button class="btn block" id="submit">Đặt hàng</button>
        <p class="small muted" style="text-align:center;margin:10px 0 0">Đặt hàng là đồng ý với điều khoản mua bán của GLOWÉ.</p>
      </aside>
    </form>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
